name: app_update_prompt
description: "Shared update prompt for AirdropFi Flutter apps: store-version check, Play In-App Updates, server-controlled minimum build."
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.7.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  in_app_update: ^4.2.3
  package_info_plus: '>=8.0.0 <10.0.0'
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
